name: Update Market Data

on:
  schedule:
    # Jam WIB (UTC+7): 08:00, 10:00, 12:00, 14:00, 16:00
    # -> UTC                : 01:00, 03:00, 05:00, 07:00, 09:00
    - cron: "0 1,3,5,7,9 * * *"
  workflow_dispatch: {}   # supaya bisa dipicu manual dari tab "Actions"

permissions:
  contents: write   # dibutuhkan supaya bisa commit data.json balik ke repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update.py
        run: python update.py

      - name: Commit & push data.json jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data, skip commit."
          else
            git commit -m "chore: update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
