<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papan Pantau — Indikator Pasar Indonesia</title>
<style>
  :root {
    --ink: #0b1220;
    --ink-2: #0f1830;
    --line: #223056;
    --amber: #f2a93b;
    --green: #4fd1a5;
    --red: #ef6b6b;
    --text: #e8ecf6;
    --text-dim: #8b96b8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "IBM Plex Sans", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  }

  .mono {
    font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 11px;
    color: var(--amber);
    margin: 0 0 6px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(79,209,165,0.6); animation: pulse 2s infinite; }
  .dot.stale { background: var(--amber); }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79,209,165,0.5); }
    70%  { box-shadow: 0 0 0 6px rgba(79,209,165,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,165,0); }
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .card {
    background: var(--ink-2);
    padding: 20px 18px;
    position: relative;
    min-height: 132px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .card .value {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.1;
  }

  .card .value .unit {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 4px;
  }

  .card .sub {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .chg { font-weight: 600; }
  .chg.up { color: var(--green); }
  .chg.down { color: var(--red); }

  .card .idx {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 10px;
    color: var(--line);
  }

  footer {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 40px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  footer a { color: var(--amber); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .error-banner {
    display: none;
    max-width: 1080px;
    margin: 20px auto 0;
    padding: 12px 16px;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
    background: rgba(239,107,107,0.08);
  }

  @media (max-width: 480px) {
    header { padding: 22px 16px 16px; }
    main { padding: 20px 16px 40px; }
    footer { padding: 0 16px 32px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <p class="eyebrow">Live Market Watch</p>
    <h1>Indikator Pasar Indonesia</h1>
  </div>
  <div class="status-line">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" class="mono">memuat…</span>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <!-- cards diisi via JS -->
  </div>
</main>

<footer>
  Data diperbarui otomatis 5× sehari (08.00–16.00 WIB) lewat GitHub Actions.
  Sumber: Frankfurter API, Yahoo Finance, worldgovernmentbonds.com.
  Hanya untuk pemantauan pribadi — bukan rekomendasi transaksi.
  <div id="errorBanner" class="error-banner"></div>
</footer>

<script>
  const CARD_DEFS = [
    { key: "usdidr", label: "USD/IDR", idx: "01", fmt: (d) => fmtNumber(d.value), unit: "IDR" },
    { key: "ihsg", label: "IHSG", idx: "02", fmt: (d) => fmtNumber(d.value), unit: "", change: true },
    { key: "crude_oil", label: "Crude Oil (WTI)", idx: "03", fmt: (d) => fmtNumber(d.value), unit: "USD/bbl", change: true },
    { key: "cds_5y", label: "CDS Indonesia 5Y", idx: "04", fmt: (d) => fmtNumber(d.value), unit: "bps" },
    { key: "bond_1y", label: "Bond Indonesia 1Y", idx: "05", fmt: (d) => fmtNumber(d.value), unit: "%" },
    { key: "bond_5y", label: "Bond Indonesia 5Y", idx: "06", fmt: (d) => fmtNumber(d.value), unit: "%" },
  ];

  function fmtNumber(v) {
    if (v === null || v === undefined) return "—";
    return Number(v).toLocaleString("id-ID", { maximumFractionDigits: 2 });
  }

  function renderCards(data) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (const def of CARD_DEFS) {
      const d = data[def.key];
      const card = document.createElement("div");
      card.className = "card";

      const idx = document.createElement("span");
      idx.className = "idx mono";
      idx.textContent = def.idx;
      card.appendChild(idx);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = def.label;
      card.appendChild(label);

      const value = document.createElement("div");
      value.className = "value mono";
      if (d && d.value !== null && d.value !== undefined) {
        value.innerHTML = `${def.fmt(d)}<span class="unit">${def.unit || ""}</span>`;
      } else {
        value.innerHTML = `—<span class="unit">belum ada data</span>`;
      }
      card.appendChild(value);

      if (def.change && d && d.change_pct !== null && d.change_pct !== undefined) {
        const sub = document.createElement("div");
        sub.className = "sub mono";
        const cls = d.change_pct > 0 ? "up" : d.change_pct < 0 ? "down" : "";
        const arrow = d.change_pct > 0 ? "▲" : d.change_pct < 0 ? "▼" : "•";
        sub.innerHTML = `<span class="chg ${cls}">${arrow} ${d.change_pct}%</span> vs sesi sebelumnya`;
        card.appendChild(sub);
      } else if (d && d.source) {
        const sub = document.createElement("div");
        sub.className = "sub mono";
        sub.textContent = d.source;
        card.appendChild(sub);
      }

      grid.appendChild(card);
    }
  }

  function renderStatus(data) {
    const dot = document.getElementById("statusDot");
    const text = document.getElementById("statusText");

    if (!data.last_updated) {
      dot.className = "dot stale";
      text.textContent = "belum pernah diperbarui";
      return;
    }

    const updated = new Date(data.last_updated);
    const now = new Date();
    const hoursSince = (now - updated) / 1000 / 3600;

    const formatted = updated.toLocaleString("id-ID", {
      dateStyle: "medium",
      timeStyle: "short",
      timeZone: "Asia/Jakarta",
    });

    if (hoursSince < 3) {
      dot.className = "dot live";
      text.textContent = `diperbarui ${formatted} WIB`;
    } else {
      dot.className = "dot stale";
      text.textContent = `terakhir diperbarui ${formatted} WIB (lebih lama dari biasanya)`;
    }
  }

  function renderErrors(status) {
    if (!status) return;
    const failed = Object.entries(status).filter(([, v]) => String(v).startsWith("error"));
    if (failed.length === 0) return;

    const banner = document.getElementById("errorBanner");
    banner.style.display = "block";
    banner.textContent =
      "Beberapa sumber gagal diambil pada update terakhir: " +
      failed.map(([k]) => k).join(", ") +
      ". Nilai yang tampil untuk item tersebut adalah data lama.";
  }

  async function load() {
    try {
      const res = await fetch("data.json?_=" + Date.now());
      const data = await res.json();
      renderCards(data);
      renderStatus(data);
      renderErrors(data.last_run_status);
    } catch (e) {
      document.getElementById("statusText").textContent = "gagal memuat data.json";
      document.getElementById("statusDot").className = "dot stale";
    }
  }

  load();
</script>

</body>
</html>
